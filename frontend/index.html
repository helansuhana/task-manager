<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="hero">
            <div>
                <h1>Task Manager</h1>
                <p class="subtitle">Manage your tasks in one place.</p>
            </div>
            <button id="logout-btn" class="secondary-btn">Logout</button>
        </header>

        <section class="card">
            <h2>Register</h2>
            <input type="text" id="register-username" placeholder="Username">
            <input type="email" id="register-email" placeholder="Email">
            <input type="password" id="register-password" placeholder="Password">
            <button id="register-btn">Register</button>
        </section>

        <section class="card">
            <h2>Login</h2>
            <input type="text" id="login-username" placeholder="Username">
            <input type="password" id="login-password" placeholder="Password">
            <button id="login-btn">Login</button>
        </section>

        <section class="card">
            <h2>Create Task</h2>
            <input type="text" id="task-title" placeholder="Task title">
            <input type="text" id="task-description" placeholder="Task description">
            <button id="create-task-btn">Create Task</button>
        </section>

        <section class="card">
            <h2>Your Tasks</h2>
            <div class="task-toolbar">
                <button id="load-tasks-btn">Refresh Tasks</button>
            </div>
            <ul id="task-list"></ul>
        </section>

        <p id="message" class="message"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
